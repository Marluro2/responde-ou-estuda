# Publica o Responda ou Estuda como site no GitHub Pages.
#
# A cada envio para a branch "main": roda as verificações do jogo, constrói o
# site estático com "flet build web" (o Python roda dentro do navegador) e
# publica. Endereço: https://<usuario>.github.io/<nome-do-repositorio>/
#
# Ativação (uma única vez): no GitHub, Settings > Pages > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Verificar e construir o site
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.86.3" "flet-audio==0.86.3"

      - name: Verificar questões e telas
        run: |
          python ferramentas/validar_conteudo.py
          python ferramentas/testar_telas.py
          python ferramentas/testar_economia.py

      - name: Construir o site (flet build web)
        # O endereço-base é o nome do repositório, então renomear o
        # repositório não exige mudar este arquivo.
        run: >
          flet build web --yes --no-rich-output
          --base-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    name: Publicar no GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
