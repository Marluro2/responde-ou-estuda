[project]
name = "responda-ou-estuda"
version = "1.0.0"
description = "Responda ou Estuda: jogo de Educação Financeira (Porcentagem, Juros, Sistema PRICE e SAC). Produto educacional de doutorado."
requires-python = ">=3.14,<3.15"
# Dependências usadas pelo site (flet build web). No computador, o
# INSTALAR.bat usa o requirements.txt.
dependencies = [
    "flet==0.86.3",
    "flet-audio==0.86.3",
]

# ---------------------------------------------------------------- flet build
[tool.flet]
product = "Responda ou Estuda"
org = "br.edu.ifsp"

[tool.flet.app]
# Não vão para o jogo publicado (site): ferramentas, testes, documentos,
# arquivos do Windows e qualquer dado de aluno.
exclude = [
    ".github",
    "__pycache__",
    "ferramentas",
    "revisao",
    "apresentacao",
    "dados/estado_jogo.json",
    "dados/estado_admin.json",
    "dados/ranking.xlsx",
    "dados/respostas.csv",
    "dados/respostas_admin.csv",
    "dados/relatorio_por_questao.csv",
    "dados/relatorio_por_jogador.csv",
    "dados/relatorio_por_questao_admin.csv",
    "dados/relatorio_por_jogador_admin.csv",
    "dados/economia.csv",
    "dados/turmas",
    "iniciar_janela_app.py",
    "INSTALAR.bat",
    "INICIAR_JOGO.bat",
    "INICIAR_ADMIN.bat",
    "INICIAR_COM_DIAGNOSTICO.bat",
    "CHECKLIST_TELAS.txt",
    "COMO_ADICIONAR_QUESTOES.txt",
    "INTEGRACAO_NOVAS_ETAPAS.txt",
    "TESTE_LIBRAS.txt",
    "README.txt",
    "requirements.txt",
]

[tool.flet.web]
# "hash": as rotas ficam depois do # e o site funciona em qualquer subpasta.
route_url_strategy = "hash"
